name: blu-bot-pipeline

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: blu-bot-pipeline-${{ github.repository }}-${{ github.event.pull_request.number }}

jobs:
  pipeline:
    if: github.event.label.name == 'admin-release'
    permissions:
      contents: read
      pull-requests: write
    uses: intempt/.github/.github/workflows/blu-bot-pipeline.yml@main
    secrets:
      BLU_BOT_PRIVATE_KEY: ${{ secrets.BLU_BOT_PRIVATE_KEY }}
